name: Update haze data

on:
  schedule:
    # 00:10 and 13:10 UTC = 8:10am and 9:10pm Singapore time (after NEA's evening update)
    - cron: "10 0,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest readings
        env:
          DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
        run: python3 scripts/fetch.py --days 2

      - name: Build site
        run: python3 scripts/build.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- public/; then
            echo "No new data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          git commit -m "data: update readings $(TZ=Asia/Singapore date +'%Y-%m-%d %H:%M') SGT"
          git push
